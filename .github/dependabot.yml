version: 2

# Os prefixos seguem Conventional Commits, para o título do PR passar no check "Título do PR":
# "ci(deps): bump ..." para actions e "build(deps): bump ..." para o resto.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      nuxt:
        patterns: ['nuxt', '@nuxt/*', 'vue', 'vue-router']
      playwright:
        patterns: ['@playwright/*']
    ignore:
      # O Playwright sobe junto com o ARG PLAYWRIGHT_VERSION do Dockerfile, à mão (a T-0012 confere).
      - dependency-name: '@playwright/test'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Node 22 é decisão de arquitetura (ADR 0001); trocar de major é task, não atualização.
      - dependency-name: node
        update-types: ['version-update:semver-major']
