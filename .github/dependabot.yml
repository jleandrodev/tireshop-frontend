version: 2

# O prefixo "Deps" é o que o check "Título do PR" aceita para atualização de dependência.
# O ecossistema npm entra na T-0001, quando o package.json passa a existir.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: Deps

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: Deps
    ignore:
      # Node 22 é decisão de arquitetura (ADR 0001); trocar de major é task, não atualização.
      - dependency-name: node
        update-types: ['version-update:semver-major']
