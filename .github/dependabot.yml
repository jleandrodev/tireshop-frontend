version: 2

# Os prefixos seguem Conventional Commits, para o título do PR passar no check "Título do PR":
# "ci(deps): bump ..." para actions e "build(deps): bump ..." para o resto.
# O ecossistema npm entra na T-0001, quando o package.json passa a existir.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Node 22 é decisão de arquitetura (ADR 0001); trocar de major é task, não atualização.
      - dependency-name: node
        update-types: ['version-update:semver-major']
