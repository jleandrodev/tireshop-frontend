name: PR

# O título do PR vira a mensagem do commit na main (o merge é sempre squash). Por isso ele segue
# Conventional Commits, em inglês (AGENTS.md, seção 7). O id da task vai no escopo:
#   feat(T-0304): filter the listing by rim size
# Fora de task, o escopo é livre ou não existe: "ci: add the build job", "build(deps): bump nuxt".

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  titulo:
    name: Título do PR
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confere a convenção
        env:
          # Pelo ambiente, nunca interpolado no script: o título é texto de quem abre o PR.
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          padrao='^(feat|fix|refactor|test|docs|build|ci|chore|perf)(\([A-Za-z0-9._/-]+\))?!?: [a-z0-9].*[^.[:space:]]$'
          if printf '%s' "$TITULO" | grep -Eq "$padrao"; then
            echo "ok: $TITULO"
          else
            echo "::error::Título fora da convenção: \"$TITULO\""
            echo "Use Conventional Commits em inglês: \"feat(T-0304): filter the listing by rim size\"."
            echo "Tipos: feat, fix, refactor, test, docs, build, ci, chore, perf. O assunto começa com"
            echo "minúscula, no imperativo, sem ponto final. Em task, o escopo é o id dela."
            exit 1
          fi
